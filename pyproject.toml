[project]
name = "thelittlehackers-core"
version = "1.4.0"
description = "Collection of reusable Python components to share with Python projects"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE.md"]
authors = [
    { name = "Daniel CAUNE", email = "daniel.caune@thelittlehackers.com" },
]
keywords = ["library", "utils"]
requires-python = ">=3.12,<4.0"
dependencies = [
    "loguru (>=0.7.3,<0.8.0)",
    "normality (>=2.6.1,<3.0.0)",
    "phonenumbers (>=9.0.35,<10.0.0)",
    "pydantic (>=2.13.4,<3.0.0)",
    "python-dateutil (>=2.9.0,<3.0.0)",
    "toml (>=0.10.2,<0.11.0)",
    "unidecode (>=1.4.0,<2.0.0)",
]
dynamic = ["classifiers"]

[project.urls]
Repository = "https://github.com/the-little-hackers/library_thelittlehackers-core_python"

[tool.poetry]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Topic :: Software Development :: Libraries",
]
packages = [{ include = "thelittlehackers", from = "src" }]

[tool.poetry.group.dev.dependencies]
black = "^26.5.1"
flake8 = "^7.3.0"
setuptools = ">=83.0.0"

[build-system]
requires = ["poetry-core>=2.2.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
